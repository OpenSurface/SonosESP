<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Réglages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0;background:#0E0C26}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:inherit;border:0;cursor:pointer;padding:0}
</style>
</helmet>
<div style="width: 480px; height: 480px; box-sizing: border-box; background: #16133A; color: #FFF7EA; font-family: Nunito, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 72px; box-sizing: border-box; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
    <a href="Enceintes.dc.html" aria-label="Retour" style="width: 48px; height: 48px; border-radius: 24px; background: #2E2A66; color: #FFF7EA; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 27px; font-weight: 900">Réglages</h1>
  </header>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="height: 66px; box-sizing: border-box; padding: 0 9px 0 12px; border-radius: 20px; background: #231F52; display: flex; align-items: center; gap: 12px">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: #3BE0A0; color: #16133A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 18px; font-weight: 900">Services</span>
        <span style="font-size: 13px; font-weight: 700; color: #B7B1E3">Spotify · enregistré le 15 nov.</span>
      </span>
      <button type="button" onClick="{{refreshSvc}}" style="height: 46px; box-sizing: border-box; padding: 0 14px 0 10px; border-radius: 23px; border: 3px solid #3BE0A0; background: transparent; color: #3BE0A0; font-size: 15px; font-weight: 900; display: flex; align-items: center; gap: 6px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>
        {{svcLabel}}
      </button>
    </div>

    <div style="height: 66px; box-sizing: border-box; padding: 0 9px 0 12px; border-radius: 20px; background: #231F52; display: flex; align-items: center; gap: 12px">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: #6CB8FF; color: #16133A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="3"></rect><circle cx="12" cy="14" r="3.5"></circle></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 18px; font-weight: 900">Enceintes</span>
        <span style="font-size: 13px; font-weight: 700; color: #B7B1E3">6 enceintes · enregistré le 15 nov.</span>
      </span>
      <button type="button" onClick="{{refreshSpk}}" style="height: 46px; box-sizing: border-box; padding: 0 14px 0 10px; border-radius: 23px; border: 3px solid #6CB8FF; background: transparent; color: #6CB8FF; font-size: 15px; font-weight: 900; display: flex; align-items: center; gap: 6px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 4v7h-7"></path></svg>
        {{spkLabel}}
      </button>
    </div>

    <div style="height: 66px; box-sizing: border-box; padding: 0 16px 0 12px; border-radius: 20px; background: #231F52; display: flex; align-items: center; gap: 12px">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: #FFD23F; color: #16133A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg></span>
      <span style="font-size: 18px; font-weight: 900">Luminosité</span>
      <div aria-label="Luminosité 70 %" style="margin-left: auto; width: 150px; height: 16px; border-radius: 8px; background: #2E2A66; overflow: hidden">
        <div style="width: 70%; height: 16px; border-radius: 8px; background: #FFD23F"></div>
      </div>
    </div>

    <div style="height: 66px; box-sizing: border-box; padding: 0 16px 0 12px; border-radius: 20px; background: #231F52; display: flex; align-items: center; gap: 12px">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: #B69CFF; color: #16133A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 18px; font-weight: 900">Veille</span>
        <span style="font-size: 13px; font-weight: 700; color: #B7B1E3">Horloge après 5 min sans musique</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B7B1E3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </div>

    <div style="height: 66px; box-sizing: border-box; padding: 0 16px 0 12px; border-radius: 20px; background: #231F52; display: flex; align-items: center; gap: 12px">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: #FF9A3C; color: #16133A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
        <span style="font-size: 18px; font-weight: 900">Mise à jour</span>
        <span style="font-size: 13px; font-weight: 700; color: #B7B1E3">Le panneau est à jour</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B7B1E3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { svc: false, spk: false };
  }
  renderVals() {
    return {
      svcLabel: this.state.svc ? 'Fait' : 'Rafraîchir',
      spkLabel: this.state.spk ? 'Fait' : 'Rafraîchir',
      refreshSvc: () => this.setState({ svc: true }),
      refreshSpk: () => this.setState({ spk: true })
    };
  }
}
</script>
</body>
</html>
