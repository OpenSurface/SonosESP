<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Paroles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0;background:#0E0C26}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font-family:inherit;border:0;cursor:pointer;padding:0;background:none;color:inherit}
</style>
</helmet>
<div style="width: 480px; height: 480px; box-sizing: border-box; background: {{bg}}; color: #FFF7EA; font-family: Nunito, system-ui, sans-serif; position: relative; overflow: hidden">

  <header style="position: absolute; left: 0; right: 0; top: 0; height: 72px; box-sizing: border-box; padding: 12px 16px; display: flex; align-items: center; gap: 12px; z-index: 2">
    <div aria-hidden="true" style="width: 48px; height: 48px; flex: none; border-radius: 14px; background: #FF7AB6; position: relative; overflow: hidden">
      <div style="position: absolute; width: 40px; height: 40px; border-radius: 20px; background: #FFD23F; left: -10px; top: 18px"></div>
      <div style="position: absolute; width: 16px; height: 16px; border-radius: 8px; background: #16133A; right: 7px; top: 7px"></div>
    </div>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span style="font-size: 18px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Au clair de la lune</span>
      <span style="font-size: 14px; font-weight: 700; color: #D9CFF2">Comptines</span>
    </div>
    <a href="Main.dc.html" aria-label="Fermer les paroles" style="width: 48px; height: 48px; flex: none; border-radius: 24px; background: {{chipBg}}; color: #FFF7EA; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </header>

  <sc-if value="{{isSync}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 0; right: 0; top: 72px; bottom: 76px; overflow: hidden">
      <div style="position: absolute; left: 24px; right: 24px; top: 0; transform: translateY({{offset}}px); transition: transform 450ms ease">
        <sc-for list="{{lines}}" as="l" hint-placeholder-count="8">
          <button type="button" onClick="{{l.seek}}" aria-current="{{l.current}}" style="width: 100%; height: 58px; display: flex; align-items: center; text-align: left; font-size: {{l.size}}px; font-weight: 900; color: {{l.color}}; opacity: {{l.opacity}}; white-space: nowrap; transition: font-size 300ms, color 300ms, opacity 300ms">{{l.text}}</button>
        </sc-for>
      </div>
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 36px; background: linear-gradient({{bg}}, transparent)"></div>
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: linear-gradient(transparent, {{bg}})"></div>
    </div>
  </sc-if>

  <sc-if value="{{isText}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; right: 0; top: 72px; bottom: 76px; overflow-y: auto; box-sizing: border-box; padding: 4px 24px 24px">
      <span style="display: inline-flex; align-items: center; height: 30px; box-sizing: border-box; padding: 0 12px; border-radius: 15px; background: {{chipBg}}; color: #FFE58A; font-size: 13px; font-weight: 800">Paroles sans le rythme : on les fait défiler du doigt</span>
      <sc-for list="{{plain}}" as="p" hint-placeholder-count="8">
        <p style="margin: 10px 0 0; font-size: 23px; line-height: 1.25; font-weight: 800; color: #FFF7EA">{{p.text}}</p>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{isNone}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 0; right: 0; top: 72px; bottom: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 40px; text-align: center">
      <div aria-hidden="true" style="width: 96px; height: 96px; border-radius: 48px; background: {{chipBg}}; color: #FF7AB6; display: flex; align-items: center; justify-content: center">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"></rect><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"></path><path d="M3.5 3.5l17 17"></path></svg>
      </div>
      <p style="margin: 0; font-size: 25px; font-weight: 900; line-height: 1.15">Pas de paroles pour cette chanson</p>
      <p style="margin: 0; font-size: 16px; font-weight: 700; color: #D9CFF2">On retourne à la lecture dans un instant.</p>
    </div>
  </sc-if>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; box-sizing: border-box; padding: 0 16px 12px; display: flex; align-items: center; gap: 14px; z-index: 2">
    <button type="button" onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="width: 56px; height: 56px; flex: none; border-radius: 28px; background: #FF7AB6; color: #16133A; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #B84A80">
      <sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1.5"></rect><rect x="13.5" y="5" width="4.5" height="14" rx="1.5"></rect></svg>
      </sc-if>
      <sc-if value="{{paused}}" hint-placeholder-val="{{false}}">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"></path></svg>
      </sc-if>
    </button>
    <div style="flex: 1; height: 12px; border-radius: 6px; background: {{chipBg}}; overflow: hidden">
      <div style="width: {{progress}}; height: 12px; border-radius: 6px; background: #FF7AB6; transition: width 450ms"></div>
    </div>
    <span style="font-size: 14px; font-weight: 800; color: #D9CFF2; white-space: nowrap">{{time}}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"etat":{"editor":"enum","options":["synchro","texte","aucune"],"default":"synchro"},"fond":{"editor":"enum","options":["pochette","nuit"],"default":"pochette"},"$preview":{"width":480,"height":480}}'>
const LINES = [
  'Au clair de la lune,', 'Mon ami Pierrot,', 'Prête-moi ta plume', 'Pour écrire un mot.',
  'Ma chandelle est morte,', 'Je n’ai plus de feu.', 'Ouvre-moi ta porte', 'Pour l’amour de Dieu.',
  'Au clair de la lune,', 'Pierrot répondit :', '« Je n’ai pas de plume,', 'Je suis dans mon lit. »'
];
const STEP = 2.6;
const fmt = (t) => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 2, playing: true };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      if (this.state.playing) this.setState({ i: (this.state.i + 1) % LINES.length });
    }, STEP * 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const etat = this.props.etat ?? 'synchro';
    const fond = this.props.fond ?? 'pochette';
    const s = this.state;
    const bg = fond === 'pochette' ? '#3A1740' : '#16133A';
    const total = LINES.length * STEP + 6;
    const pos = 3 + s.i * STEP;
    return {
      bg,
      chipBg: fond === 'pochette' ? '#561F5C' : '#2E2A66',
      isSync: etat === 'synchro',
      isText: etat === 'texte',
      isNone: etat === 'aucune',
      offset: 96 - s.i * 58,
      lines: LINES.map((text, k) => {
        const d = k - s.i;
        return {
          text,
          current: d === 0 ? 'true' : 'false',
          size: d === 0 ? 30 : (d < 0 ? 20 : 22),
          color: d === 0 ? '#FFD23F' : (d < 0 ? '#FFF7EA' : '#E3DAF5'),
          opacity: d === 0 ? 1 : (d < 0 ? 0.35 : (d > 3 ? 0.5 : 0.9)),
          seek: () => this.setState({ i: k })
        };
      }),
      plain: LINES.map((text) => ({ text })),
      playing: s.playing,
      paused: !s.playing,
      playLabel: s.playing ? 'Pause' : 'Lecture',
      togglePlay: () => this.setState({ playing: !s.playing }),
      progress: Math.round(pos / total * 100) + '%',
      time: fmt(pos) + ' / ' + fmt(total)
    };
  }
}
</script>
</body>
</html>
