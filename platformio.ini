; =============================================================================
;  SonosESP — PlatformIO project
;  ONE project, ONE codebase. Each SCREEN is a build environment ([env:...]) below.
;  Shared settings live in [env]; each screen only adds what differs (-DSCREEN_SIZE
;  + which panel driver to ignore). config.h resolves dims/pins from SCREEN_SIZE.
;
;     pio run -e esp32_4inch -t upload      # 4" (working)
;     pio run -e esp32_7inch -t upload      # 7" (PLACEHOLDER / WIP — see below)
;
;  `pio run` with no -e builds only the default (4") via default_envs.
;  See docs/MULTI_SCREEN_SUPPORT.md.
; =============================================================================
[platformio]
default_envs = esp32_4inch

; =============================================================================
;  [esp32_base]  —  settings shared by every HARDWARE screen variant
;
;  Deliberately NOT [env]: that block applies to every environment, the host test
;  env included, so `pio test -e native` inherited board = esp32-p4 and failed to
;  build. Hardware envs opt in with `extends`.
; =============================================================================
[esp32_base]
; 55.03.38-1, not 55.03.38: a one-day-later patch whose release notes read
; "Platform fix: Wrong cmd build for OpenOCD - no changes in Arduino, no changes
; in IDF against release 55.03.38". Debugger tooling only; the firmware is byte
; identical in intent.
;
; NOT 55.03.39 or 55.03.311, deliberately. Commit 2a01b884 ("fix p4 rev3", shipped
; in 311) comments out the ESP32-P4 rev3 linker-script selection in
; builder/frameworks/espidf.py, so every P4 falls back to sections.ld.in. 3.3.9
; also still carries the esp-hosted regression, which matters on a board whose
; WiFi runs over SDIO. Re-evaluate when the P4 linker line is restored upstream.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-p4
framework = arduino

; === FLASH & STORAGE ===
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L         ; 80MHz flash speed (max for QIO)

; === PSRAM (32MB OPI) ===
board_build.psram_type = opi
board_build.f_psram = 200000000L        ; 200MHz PSRAM speed (OPI max)

; === CPU FREQUENCY ===
board_build.f_cpu = 400000000L          ; 400MHz dual-core RISC-V (official max per datasheet)

lib_ldf_mode = deep
lib_archive = false

extra_scripts =
    pre:scripts/remove_lvgl_asm.py
    pre:scripts/use_ccache.py        ; no-op unless CI sets USE_CCACHE=1 (graceful)
    pre:scripts/patch_gt911_bounds.py ; clamps an unbounded loop in TAMC_GT911 (see script header)

; Shared build flags. The per-screen -DSCREEN_SIZE is added in each env below
; (via ${esp32_base.build_flags} — build_flags do NOT auto-merge across sections).
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I.
    ; Optimization flags for RISC-V dual-core
    -O3
    -ffunction-sections
    -fdata-sections
    ; PSRAM XIP (Execute In Place) — uncomment to test: -DCONFIG_SPIRAM_XIP_FROM_PSRAM=1
    ; LVGL ASM disabled (RISC-V, not ARM)
    -DLV_USE_DRAW_SW_ASM=LV_DRAW_SW_ASM_NONE
    -DLV_USE_DRAW_SW_ASM_HELIUM=0
    -DLV_USE_DRAW_SW_ASM_NEON=0
    -Wno-deprecated-declarations
    -Wno-attributes
    ; ESP-IDF component access for PPA driver
    -Wl,-Map,firmware.map
    ; Reduce mbedTLS buffer sizes to save DMA memory for OTA (prevents SDIO crashes)
    -DCONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
    -DCONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096

build_unflags =

build_src_filter =
    +<*>
    +<screens/*>
    +<fonts/*.c>
    -<.git/>
    -<.svn/>

upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    lvgl/lvgl@^9.5.0
    tamctec/TAMC_GT911@^1.0.2
    bblanchon/ArduinoJson@^7.4.3
    bitbank2/PNGdec@^1.1.6
    bitbank2/JPEGDEC@^1.8.4

; =============================================================================
;  native  —  host unit tests, no hardware        `pio test -e native`
;  Covers the framework-free logic only (include/sonos_topology.h): the
;  ZoneGroupState parser and RINCON comparison, which is where the v1.15.1 group
;  regression and the satellite miscount both lived. Not part of default_envs, so
;  `pio run` is unaffected.
; =============================================================================
[env:native]
platform       = native
test_framework = unity
build_flags    = -std=gnu++17 -Iinclude -Wall -Wextra
; No firmware sources: these tests cover include/sonos_topology.h, which is
; header-only and free of Arduino/FreeRTOS/LVGL on purpose.
build_src_filter = -<*>
; No lib_ldf_mode override here. Setting it to 'off' stops the dependency finder
; adding Unity's include path, so unity.h is installed but never found (CI #192).

; =============================================================================
;  4"  —  GUITION JC4880P433C  (ST7701, 800x480)            [ WORKING ]
; =============================================================================
[env:esp32_4inch]
extends     = esp32_base
build_flags = ${esp32_base.build_flags} -DSCREEN_SIZE=4
lib_ignore  = jd9165_lcd        ; 7" panel driver — not used on the 4"

; =============================================================================
;  7"  —  GUITION JC1060P470C  (JD9165, 1024x600)     [ CODE-COMPLETE / UNTESTED ]
;  Panel driver ported (lib/jd9165_lcd, native 1024x600 landscape, no rotation)
;  and the UI is resolution-relative (include/ui_scale.h), so this env BUILDS and
;  LINKS cleanly. NOT yet validated on physical 7" hardware. See
;  lib/jd9165_lcd/README.md and docs/MULTI_SCREEN_SUPPORT.md.
; =============================================================================
[env:esp32_7inch]
extends     = esp32_base
build_flags = ${esp32_base.build_flags} -DSCREEN_SIZE=7
lib_ignore  = st7701_lcd        ; 4" panel driver — not used on the 7"
