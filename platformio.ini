; =============================================================================
;  SonosESP — PlatformIO project
;  ONE project, ONE codebase. Each SCREEN is a build environment ([env:...]) below.
;  Shared settings live in [env]; each screen only adds what differs (-DSCREEN_SIZE
;  + which panel driver to ignore). config.h resolves dims/pins from SCREEN_SIZE.
;
;     pio run -e esp32_4inch -t upload      # 4" (working)
;     pio run -e esp32_7inch -t upload      # 7" (PLACEHOLDER / WIP — see below)
;
;  `pio run` with no -e builds only the default (4") via default_envs.
;  See docs/MULTI_SCREEN_SUPPORT.md.
; =============================================================================
[platformio]
default_envs = esp32_4inch

; =============================================================================
;  [esp32_base]  —  settings shared by every HARDWARE screen variant
;
;  Deliberately NOT [env]: that block applies to every environment, the host test
;  env included, so `pio test -e native` inherited board = esp32-p4 and failed to
;  build. Hardware envs opt in with `extends`.
; =============================================================================
[esp32_base]
; 55.03.38-1, not 55.03.38: a one-day-later patch whose release notes read
; "Platform fix: Wrong cmd build for OpenOCD - no changes in Arduino, no changes
; in IDF against release 55.03.38". Debugger tooling only; the firmware is byte
; identical in intent.
;
; NOT 55.03.39 or 55.03.311, deliberately. Commit 2a01b884 ("fix p4 rev3", shipped
; in 311) comments out the ESP32-P4 rev3 linker-script selection in
; builder/frameworks/espidf.py, so every P4 falls back to sections.ld.in. 3.3.9
; also still carries the esp-hosted regression, which matters on a board whose
; WiFi runs over SDIO. Re-evaluate when the P4 linker line is restored upstream.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-p4
framework = arduino

; === FLASH & STORAGE ===
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L         ; 80MHz flash speed (max for QIO)

; === PSRAM (32MB OPI) ===
board_build.psram_type = opi
board_build.f_psram = 200000000L        ; 200MHz PSRAM speed (OPI max)

; === CPU FREQUENCY ===
board_build.f_cpu = 400000000L          ; 400MHz dual-core RISC-V (official max per datasheet)

lib_ldf_mode = deep
lib_archive = false

extra_scripts =
    pre:scripts/remove_lvgl_asm.py
    pre:scripts/use_ccache.py        ; no-op unless CI sets USE_CCACHE=1 (graceful)
    pre:scripts/patch_gt911_bounds.py ; clamps an unbounded loop in TAMC_GT911 (see script header)

; Shared build flags. The per-screen -DSCREEN_SIZE is added in each env below
; (via ${esp32_base.build_flags} — build_flags do NOT auto-merge across sections).
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I.
    ; NO -O3 here, deliberately.
    ;
    ; PlatformIO places project build_flags BEFORE the framework's own, and GCC
    ; takes the last -O it sees. The real compile line ends "... -O3
    ; -ffunction-sections -fdata-sections ... -Os -ffunction-sections ...", so the
    ; framework's -Os won every translation unit and both panels have ALWAYS built
    ; at -Os. The flag sat here for years describing a build that did not exist.
    ; (Check it yourself: grep -O in .pio/build/esp32_4inch/idedata.json.)
    ;
    ; Removing it is a zero-byte change. Actually opting in needs
    ; `build_unflags = -Os`, which alters codegen, size and timing in every
    ; function across a 10K-device Stable fleet — that is a deliberate,
    ; bench-flash-tested release of its own, not a line in a cleanup commit.
    -ffunction-sections
    -fdata-sections
    ; PSRAM XIP (Execute In Place) — uncomment to test: -DCONFIG_SPIRAM_XIP_FROM_PSRAM=1
    ; LVGL ASM disabled (RISC-V, not ARM)
    -DLV_USE_DRAW_SW_ASM=LV_DRAW_SW_ASM_NONE
    -DLV_USE_DRAW_SW_ASM_HELIUM=0
    -DLV_USE_DRAW_SW_ASM_NEON=0
    -Wno-deprecated-declarations
    -Wno-attributes
    ; Emit a linker map, which several of the size investigations depend on.
    -Wl,-Map,firmware.map
    ;
    ; The two -DCONFIG_MBEDTLS_SSL_*_CONTENT_LEN=4096 flags that used to sit here
    ; were dead, and their comment claimed they were an SDIO mitigation — so the
    ; defence inventory listed a layer that was never present. Two reasons they
    ; could not work:
    ;
    ;   1. esp_config.h reads them only inside the #else of
    ;      "#ifndef CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN", and the shipped
    ;      qio_qspi sdkconfig.h does not define ASYMMETRIC — it defines
    ;      CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN 16384. The #ifndef branch is taken
    ;      and neither macro is ever read.
    ;   2. mbedTLS ships as a prebuilt libmbedtls.a, so a project-side -D cannot
    ;      resize buffers in already-compiled code regardless of the guard.
    ;
    ; The firmware's own comments record the un-reduced sizes and always did:
    ; lyrics.cpp "TLS buffers (~32KB DMA)" is 2 x 16KB, ui_network_guard.h says
    ; ~71KB. Shrinking them for real needs a custom sdkconfig, which is a much
    ; bigger decision than a build flag.

build_unflags =

build_src_filter =
    +<*>
    +<screens/*>
    +<fonts/*.c>
    -<square/>          ; the square S3 build's own UI and drivers (esp32s3_square)
    -<.git/>
    -<.svn/>

upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; EXACT versions, not carets. A caret resolves to the newest matching release
; at install time, and PlatformIO has no lockfile - so the same platformio.ini
; produced different firmware depending on whether .pio/libdeps was warm.
;
; A developer machine keeps whatever it installed first (PlatformIO never
; upgrades in place while the constraint is still satisfied). Every CI runner
; starts cold, because the build cache covers ~/.platformio and NOT the
; project's .pio/libdeps. So `lvgl@^9.5.0` meant 9.5.0 here and 9.6.0 there:
; v2.1.0 and v2.1.1 were flash-tested against 9.5.0 and SHIPPED against 9.6.0,
; on a project whose entire UI is LVGL. `pio pkg outdated` says this out loud -
; Current 9.5.0, Wanted 9.6.0 - and Current != Wanted is the drift.
;
; Pinned to what actually shipped, so the tested artifact and the released one
; are the same build. Upgrading is now a commit somebody makes on purpose.
; Check for updates with `pio pkg outdated`; the weekly Dependency Drift
; workflow opens an issue when something moves.
lib_deps =
    lvgl/lvgl@9.6.0
    tamctec/TAMC_GT911@1.0.2
    bblanchon/ArduinoJson@7.4.3
    bitbank2/PNGdec@1.1.6
    bitbank2/JPEGDEC@1.8.4

; =============================================================================
;  native  —  host unit tests, no hardware        `pio test -e native`
;  Covers the framework-free logic only — the headers written to be free of
;  Arduino, FreeRTOS and LVGL on purpose, each with a suite under test/:
;
;      include/sonos_topology.h    ZoneGroupState parsing, RINCON comparison
;                                  (the v1.15.1 group regression, the satellite
;                                  miscount)
;      include/reboot_log.h        restart history
;      include/battery.h           portable speaker battery (#165)
;      include/sleep_timer.h       sleep timer arithmetic and wire format (#173)
;      include/position_estimate.h smooth playback position for the progress
;                                  bar and lyric cues
;      include/smapi.h             music-service accounts, SMAPI envelopes,
;                                  responses, faults and playback URIs
;
;  Not part of default_envs, so `pio run` is unaffected.
; =============================================================================
[env:native]
platform       = native
test_framework = unity
build_flags    = -std=gnu++17 -Iinclude -Wall -Wextra
; No firmware sources: every header under test is header-only and framework-free
; (listed above — keep that list, not a second copy here, up to date).
build_src_filter = -<*>
; No lib_ldf_mode override here. Setting it to 'off' stops the dependency finder
; adding Unity's include path, so unity.h is installed but never found (CI #192).

; =============================================================================
;  4"  —  GUITION JC4880P443C  (ST7701, 800x480)            [ WORKING ]
; =============================================================================
[env:esp32_4inch]
extends     = esp32_base
build_flags = ${esp32_base.build_flags} -DSCREEN_SIZE=4
lib_ignore  = jd9165_lcd        ; 7" panel driver — not used on the 4"

; =============================================================================
;  4"  —  ESP32-P4 revision 3.x silicon                            (issue #203)
;
;  SAME panel, SAME code. The only difference is which silicon revision the
;  image is built for, and the two are MUTUALLY EXCLUSIVE - this is not a
;  preference, it is enforced in the bootloader:
;
;    board esp32-p4     -> chip_variant esp32p4_es -> image header rev 1..199
;    board esp32-p4_r3  -> chip_variant esp32p4    -> image header rev 301..399
;
;  bootloader_common_check_chip_validity() applies the MAX revision check to
;  application images, so a pre-rev3 app on a v3.2 chip is refused outright
;  ("chip revision check failed. Required <= v1.99, found v3.2") and never
;  reaches display init. The bootloader image itself skips that check, which is
;  why such a board still flashes and verifies cleanly before going dark.
;
;  There is therefore NO single binary that can serve both revisions, and two
;  release assets are unavoidable rather than a convenience.
;
;  The r3 board also brings CPU 400MHz (vs 360) and light-sleep CPU power-down.
;
;  How to tell which you have: esptool reports it, e.g.
;      pio run -t nobuild -t upload   (or) esptool chip-id
;  prints "ESP32-P4 (revision v3.2)".
;
;  UNTESTED HERE - there is no rev3 board on the bench. Reported, diagnosed and
;  verified on hardware by @Insanityforawhile in #203.
; =============================================================================
[env:esp32_4inch_r3]
extends     = esp32_base
board       = esp32-p4_r3
build_flags = ${esp32_base.build_flags} -DSCREEN_SIZE=4
lib_ignore  = jd9165_lcd        ; 7" panel driver — not used on the 4"

; =============================================================================
;  4"  —  PORTRAIT  (same ST7701 panel, mounted upright, 480x800)
;
;  The ST7701 is a portrait panel: the landscape builds above rotate every
;  frame into it. UI_PORTRAIT drops that rotation and swaps in the portrait
;  layouts (bottom tab bar, stacked player). A separate image rather than a
;  runtime setting, so it is a separate OTA asset too (ui_handlers.cpp).
;  Same r3 split as above, for the same bootloader reason.
; =============================================================================
[env:esp32_4inch_portrait]
extends     = esp32_base
build_flags = ${esp32_base.build_flags} -DSCREEN_SIZE=4 -DUI_PORTRAIT=1
lib_ignore  = jd9165_lcd

[env:esp32_4inch_r3_portrait]
extends     = esp32_base
board       = esp32-p4_r3
build_flags = ${esp32_base.build_flags} -DSCREEN_SIZE=4 -DUI_PORTRAIT=1
lib_ignore  = jd9165_lcd

; =============================================================================
;  7"  —  GUITION JC1060P470C  (JD9165, 1024x600)     [ CODE-COMPLETE / UNTESTED ]
;  Panel driver ported (lib/jd9165_lcd, native 1024x600 landscape, no rotation)
;  and the UI is resolution-relative (include/ui_scale.h), so this env BUILDS and
;  LINKS cleanly. NOT yet validated on physical 7" hardware. See
;  lib/jd9165_lcd/README.md and docs/MULTI_SCREEN_SUPPORT.md.
; =============================================================================
[env:esp32_7inch]
extends     = esp32_base
build_flags = ${esp32_base.build_flags} -DSCREEN_SIZE=7
lib_ignore  = st7701_lcd        ; 4" panel driver — not used on the 7"

; =============================================================================
;  SQUARE 4"  —  GUITION ESP32-4848S040 "86 box"  (ESP32-S3R8, ST7701S RGB, 480x480)
;
;  A different board on a different chip, with its own simple UI (src/square/).
;  It shares the Sonos / SMAPI core with the P4 builds and nothing else:
;    - ESP32-S3: native Wi-Fi (no esp-hosted / SDIO), 8MB octal PSRAM, no JPEG
;      codec (art is decoded in software), no PPA, no MIPI DSI;
;    - the panel is a 16-bit RGB bus, initialised over a bit-banged 3-wire SPI;
;    - console on a CH340 UART (/dev/ttyUSB0), not USB-CDC.
;
;     pio run -e esp32s3_square -t upload --upload-port /dev/ttyUSB0
; =============================================================================
[env:esp32s3_square]
platform = ${esp32_base.platform}
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
lib_ldf_mode = deep
lib_archive = false
lib_deps = ${esp32_base.lib_deps}
lib_ignore =
    st7701_lcd          ; MIPI DSI (P4) panel drivers
    jd9165_lcd
extra_scripts =
    pre:scripts/remove_lvgl_asm.py
    pre:scripts/patch_gt911_bounds.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I.
    -DSCREEN_SIZE=4
    -DUI_SQUARE=1
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -ffunction-sections
    -fdata-sections
    -DLV_USE_DRAW_SW_ASM=LV_DRAW_SW_ASM_NONE
    -Wno-deprecated-declarations
    -Wno-attributes
build_src_filter =
    -<*>
    +<square/>
    +<touch_driver.cpp>
    +<lv_malloc_psram.cpp>
    +<sonos_controller.cpp>
    +<sonos_discovery.cpp>
    +<battery.cpp>
    +<ui_network_guard.cpp>
    +<ui_globals.cpp>
    +<music_services.cpp>
    +<stb_jpeg.cpp>
    +<ui_fonts.cpp>
    +<fonts/*.c>
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
