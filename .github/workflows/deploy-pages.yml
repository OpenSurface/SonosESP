name: Deploy Web Installer

on:
  push:
    branches: [ main ]
    # Only redeploy when the firmware or the installer page actually changes —
    # not on doc/workflow-only pushes (which would otherwise trigger a full
    # firmware rebuild for nothing). Manual runs are always available below.
    paths:
      - 'version.json'
      - 'web-installer/**'
      - 'src/**'
      - 'include/**'
      - 'lib/**'
      - 'platformio.ini'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true  # Cancel old runs to prevent duplicate artifacts

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Read version from version.json
      id: get_version
      run: |
        VERSION=$(jq -r '.version' version.json)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $VERSION"

    - name: Check if nightly version
      id: check_nightly
      run: |
        VERSION="${{ steps.get_version.outputs.VERSION }}"
        if echo "$VERSION" | grep -q "nightly"; then
          echo "IS_NIGHTLY=true" >> $GITHUB_OUTPUT
          echo "⚠️ Nightly version detected ($VERSION)"
          echo "Web installer deployment skipped for nightly builds"
          echo "Use the nightly-release.yml workflow for nightly builds"
        else
          echo "IS_NIGHTLY=false" >> $GITHUB_OUTPUT
          echo "✓ Stable version detected - proceeding with web installer deployment"
        fi

    - name: Set up Python
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Cache PlatformIO
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      uses: actions/cache@v5
      with:
        path: |
          ~/.platformio
        key: ${{ runner.os }}-pio-v3-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-v3-

    - name: Set up ccache
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ runner.os }}-ccache-${{ hashFiles('**/platformio.ini') }}

    - name: Install PlatformIO
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Clean build directory
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      run: |
        rm -rf .pio
        echo "Build directory cleaned"

    - name: Build firmware (both screen variants)
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      env:
        USE_CCACHE: "1"
      run: pio run -e esp32_4inch -e esp32_7inch

    - name: Copy binaries to web-installer
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      run: |
        mkdir -p web-installer
        # bootloader + partitions are board-level (identical across SCREEN_SIZE);
        # both manifests reference these shared names.
        cp .pio/build/esp32_4inch/bootloader.bin web-installer/
        cp .pio/build/esp32_4inch/partitions.bin web-installer/
        # otadata initialiser. Without this the web installer leaves otadata
        # untouched, so a device that last OTA'd into app1 keeps booting app1
        # (stale firmware) even though the new image landed in app0.
        BOOT_APP0="$(find ~/.platformio/packages -name boot_app0.bin -print -quit)"
        if [ -z "$BOOT_APP0" ]; then
          echo "::error::boot_app0.bin not found under ~/.platformio/packages."
          echo "Without it the installer leaves otadata untouched and devices boot stale firmware."
          exit 1
        fi
        echo "boot_app0.bin: $BOOT_APP0"
        cp "$BOOT_APP0" web-installer/
        # canonical per-screen app binaries
        cp .pio/build/esp32_4inch/firmware.bin web-installer/firmware-4inch.bin
        cp .pio/build/esp32_7inch/firmware.bin web-installer/firmware-7inch.bin
        # legacy alias (manifest.json) — kept during the ~1-month transition, then remove
        cp .pio/build/esp32_4inch/firmware.bin web-installer/firmware.bin
        ls -la web-installer/

    - name: Verify manifests against published files
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      run: |
        python - <<'EOF'
        import json, os, sys, glob, re
        failed = False

        # Guard 2: version.json, the manifests and FIRMWARE_VERSION must agree.
        # bump_version.py writes all of them, but a commit that stages only some
        # paths can ship a release whose firmware reports the PREVIOUS version -
        # the OTA check then sees latest != current forever, offers an update,
        # installs the same build, and still reports the old number.
        ver_json = json.load(open('version.json'))['version']
        m = re.search(r'FIRMWARE_VERSION\s+"([^"]+)"', open('include/ui_common.h').read())
        ver_fw = m.group(1) if m else None
        print(f"version.json={ver_json}  FIRMWARE_VERSION={ver_fw}")
        if ver_fw != ver_json:
            print(f"MISMATCH  include/ui_common.h says {ver_fw}, version.json says {ver_json}")
            failed = True
        for mf in sorted(glob.glob('web-installer/manifest*.json')):
            mv = json.load(open(mf)).get('version')
            if mv != ver_json:
                print(f"MISMATCH  {mf} says {mv}, version.json says {ver_json}")
                failed = True

        # Guard 1 - the original: manifest.json omitted boot_app0.bin entirely,
        # so devices that had OTA'd into app1 kept booting app1 after a web install.
        # A missing/renamed binary fails just as silently, so check both directions.
        for mf in sorted(glob.glob('web-installer/manifest*.json')):
            m = json.load(open(mf))
            for build in m.get('builds', []):
                offsets = []
                for part in build.get('parts', []):
                    p = os.path.join('web-installer', part['path'])
                    ok = os.path.isfile(p)
                    size = os.path.getsize(p) if ok else 0
                    print(f"{'ok ' if ok and size else 'MISSING'}  {mf} -> {part['path']} @ {hex(part['offset'])} ({size} B)")
                    if not ok or not size:
                        failed = True
                    offsets.append(part['offset'])
                if 0xe000 not in offsets:
                    print(f"MISSING  {mf}: no part at 0xe000 (boot_app0.bin / otadata init)")
                    failed = True
                if sorted(offsets) != offsets:
                    print(f"WARN     {mf}: parts are not in ascending offset order")
        sys.exit(1 if failed else 0)
        EOF

    - name: Setup Pages
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      uses: actions/configure-pages@v6

    - name: Upload artifact
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      uses: actions/upload-pages-artifact@v5
      with:
        path: './web-installer'
        retention-days: 1  # Auto-cleanup after 1 day

    - name: Deploy to GitHub Pages
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      id: deployment
      uses: actions/deploy-pages@v5
