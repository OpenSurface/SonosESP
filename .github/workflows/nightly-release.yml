name: Nightly Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g., 1.2.0-nightly.abc1234)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false  # Don't cancel release in progress

jobs:
  nightly-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Validate version tag format
      run: |
        if ! echo "${{ inputs.version_tag }}" | grep -qiE '^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[a-f0-9]{7}$'; then
          echo "Error: Version tag must match format: X.Y.Z-nightly.COMMITHASH"
          echo "Example: 1.2.0-nightly.abc1234 or 1.2.0-nightly.ABC1234"
          echo "Provided: ${{ inputs.version_tag }}"
          exit 1
        fi
        echo "Version tag validated: ${{ inputs.version_tag }}"

    - name: Check if release already exists
      id: check_release
      run: |
        if gh release view "v${{ inputs.version_tag }}" > /dev/null 2>&1; then
          echo "EXISTS=true" >> $GITHUB_OUTPUT
          echo "Release v${{ inputs.version_tag }} already exists"
        else
          echo "EXISTS=false" >> $GITHUB_OUTPUT
          echo "Release v${{ inputs.version_tag }} does not exist"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      if: steps.check_release.outputs.EXISTS == 'false'
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Cache PlatformIO
      if: steps.check_release.outputs.EXISTS == 'false'
      uses: actions/cache@v5
      with:
        path: |
          ~/.platformio
        key: ${{ runner.os }}-pio-v3-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-v3-

    - name: Set up ccache
      if: steps.check_release.outputs.EXISTS == 'false'
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ runner.os }}-ccache-${{ hashFiles('**/platformio.ini') }}

    - name: Install PlatformIO
      if: steps.check_release.outputs.EXISTS == 'false'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Clean build directory
      if: steps.check_release.outputs.EXISTS == 'false'
      run: |
        rm -rf .pio
        echo "Build directory cleaned"

    - name: Build firmware
      if: steps.check_release.outputs.EXISTS == 'false'
      env:
        USE_CCACHE: "1"
      run: pio run

    # firmware-merged.bin was dropped in v1.15.1 for the same reason as in
    # auto-release.yml: esptool merge-bin was placing the bootloader at 0x0 when
    # the P4 ROM reads it at 0x2000, and omitting boot_app0.bin at 0xe000, so the
    # image would not boot. Nothing downloaded it. Note that firmware.bin below is
    # NOT legacy here — it is the asset the Nightly OTA channel actually installs.

    - name: Create release ZIP
      if: steps.check_release.outputs.EXISTS == 'false'
      run: |
        cd .pio/build/esp32_4inch
        zip -r ../../../sonos-controller-nightly-v${{ inputs.version_tag }}.zip bootloader.bin partitions.bin firmware.bin
        echo "Created nightly release ZIP"

    - name: Create GitHub Nightly Release
      if: steps.check_release.outputs.EXISTS == 'false'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ inputs.version_tag }}
        name: v${{ inputs.version_tag }} (Nightly)
        body: |
          ## ⚠️ Nightly Release

          This is an **unstable nightly build** for testing purposes.

          - Built from: `${{ github.ref_name }}` branch
          - Commit: ${{ github.sha }}
          - Build date: ${{ github.event.repository.updated_at }}

          ### Installation
          Use the OTA update feature with "Nightly" channel selected, or flash manually via web installer.

          ### ⚠️ Warning
          Nightly builds may contain bugs, incomplete features, or breaking changes. Use at your own risk!

        files: |
          sonos-controller-nightly-v${{ inputs.version_tag }}.zip
          .pio/build/esp32_4inch/firmware.bin
          .pio/build/esp32_4inch/bootloader.bin
          .pio/build/esp32_4inch/partitions.bin
        draft: false
        prerelease: true
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
