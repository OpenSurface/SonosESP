name: Auto Release

on:
  push:
    paths:
      - 'version.json'
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel release in progress

jobs:
  auto-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Read version from version.json
      id: get_version
      run: |
        VERSION=$(jq -r '.version' version.json)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    # Version consistency, BEFORE anything is published.
    #
    # deploy-pages.yml has had this check for a long time ("Guard 2"), but that
    # workflow fires off the same version.json push, in parallel with this one.
    # So the guard failed the SITE deploy after the mismatched GitHub release had
    # already gone out - to the artefact the fleet actually installs. Backwards.
    #
    # The failure it prevents: bump_version.py writes version.json, the manifests
    # and FIRMWARE_VERSION together, but a commit that stages only some of those
    # paths ships firmware reporting the PREVIOUS version. The OTA check then sees
    # latest != current forever: it offers an update, installs the same build, and
    # still reports the old number. Cheap to run twice; ruinous to skip here.
    - name: Guard — version.json, manifests and FIRMWARE_VERSION must agree
      run: |
        python - <<'PY'
        import glob, json, re, sys
        failed = False
        ver_json = json.load(open('version.json'))['version']
        m = re.search(r'FIRMWARE_VERSION\s+"([^"]+)"', open('include/ui_common.h').read())
        ver_fw = m.group(1) if m else None
        print(f"version.json={ver_json}  FIRMWARE_VERSION={ver_fw}")
        if ver_fw != ver_json:
            print(f"MISMATCH  include/ui_common.h says {ver_fw}, version.json says {ver_json}")
            failed = True
        for mf in sorted(glob.glob('web-installer/manifest*.json')):
            mv = json.load(open(mf)).get('version')
            if mv != ver_json:
                print(f"MISMATCH  {mf} says {mv}, version.json says {ver_json}")
                failed = True
        if failed:
            print("\nRefusing to publish a release whose firmware reports a different version.")
            sys.exit(1)
        print("Versions agree.")
        PY

    - name: Check if nightly version
      id: check_nightly
      run: |
        VERSION="${{ steps.get_version.outputs.VERSION }}"
        if echo "$VERSION" | grep -q "nightly"; then
          echo "IS_NIGHTLY=true" >> $GITHUB_OUTPUT
          echo "⚠️ Nightly version detected ($VERSION)"
          echo "Stable auto-release workflow will not run for nightly versions"
          echo "Use the nightly-release.yml workflow for nightly builds"
        else
          echo "IS_NIGHTLY=false" >> $GITHUB_OUTPUT
          echo "✓ Stable version detected - proceeding with release"
        fi

    - name: Check if release already exists
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      id: check_release
      run: |
        if gh release view "v${{ steps.get_version.outputs.VERSION }}" > /dev/null 2>&1; then
          echo "EXISTS=true" >> $GITHUB_OUTPUT
          echo "Release v${{ steps.get_version.outputs.VERSION }} already exists"
        else
          echo "EXISTS=false" >> $GITHUB_OUTPUT
          echo "Release v${{ steps.get_version.outputs.VERSION }} does not exist"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true' && steps.check_release.outputs.EXISTS == 'false'
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Cache PlatformIO
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true' && steps.check_release.outputs.EXISTS == 'false'
      uses: actions/cache@v6
      with:
        path: |
          ~/.platformio
        key: ${{ runner.os }}-pio-v3-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-v3-

    - name: Set up ccache
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true' && steps.check_release.outputs.EXISTS == 'false'
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ runner.os }}-ccache-${{ hashFiles('**/platformio.ini') }}

    - name: Install PlatformIO
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true' && steps.check_release.outputs.EXISTS == 'false'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Clean build directory
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true' && steps.check_release.outputs.EXISTS == 'false'
      run: |
        rm -rf .pio
        echo "Build directory cleaned"

    - name: Build firmware (both screen variants)
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true' && steps.check_release.outputs.EXISTS == 'false'
      env:
        USE_CCACHE: "1"
      run: pio run -e esp32_4inch -e esp32_7inch

    - name: Assemble release assets (per-screen)
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true' && steps.check_release.outputs.EXISTS == 'false'
      run: |
        VER="${{ steps.get_version.outputs.VERSION }}"
        ROOT="$PWD"
        mkdir -p dist
        # bootloader + partitions are board-level (identical across SCREEN_SIZE) -> share one copy
        cp .pio/build/esp32_4inch/bootloader.bin dist/bootloader.bin
        cp .pio/build/esp32_4inch/partitions.bin dist/partitions.bin
        for s in 4inch 7inch; do
          OUT=".pio/build/esp32_${s}"
          cp "$OUT/firmware.bin" "dist/firmware-${s}.bin"
          (cd "$OUT" && zip -r "$ROOT/dist/sonos-controller-firmware-${s}-v${VER}.zip" bootloader.bin partitions.bin firmware.bin)
        done
        ls -l dist/

        # DROPPED in v1.15.1 — firmware-merged-*.bin, firmware-merged.bin, firmware.bin
        #
        # The merged images were built with `esptool merge-bin` at
        #   0x0 bootloader / 0x8000 partitions / 0x10000 firmware
        # which is wrong twice over. The P4 ROM reads the bootloader at 0x2000, not
        # 0x0, and boot_app0.bin at 0xe000 was omitted entirely — the same omission
        # fixed for the web installer in "fix(installer): write boot_app0.bin so a
        # reflash actually takes effect", and which deploy-pages.yml now has an
        # explicit CI guard against. The merged assets bypassed that guard.
        #
        # Nothing consumed them: the web installer flashes the multi-part manifest
        # (bootloader/partitions/boot_app0/firmware-Ninch), and every merged asset
        # had 0 downloads on every release. Removing them also takes esptool out of
        # the release path entirely.
        #
        # The legacy unsuffixed firmware.bin existed for the <=v1.8.4 fleet, whose
        # OTA matched on the "firmware.bin" substring. It also shows 0 downloads on
        # every release checked (v1.13.0 through v1.15.0) while the per-screen
        # assets in those same releases show real traffic, so that fleet is gone.
        #
        # If a single-file flash image is ever wanted again, do NOT reintroduce
        # esptool: PlatformIO already emits .pio/build/<env>/firmware.factory.bin
        # with the correct 0x2000/0x8000/0xe000/0x10000 layout on every build.

    - name: Create GitHub Release
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true' && steps.check_release.outputs.EXISTS == 'false'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ steps.get_version.outputs.VERSION }}
        name: v${{ steps.get_version.outputs.VERSION }}
        files: |
          dist/firmware-4inch.bin
          dist/firmware-7inch.bin
          dist/bootloader.bin
          dist/partitions.bin
          dist/sonos-controller-firmware-4inch-v${{ steps.get_version.outputs.VERSION }}.zip
          dist/sonos-controller-firmware-7inch-v${{ steps.get_version.outputs.VERSION }}.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
