name: Auto Release

on:
  push:
    paths:
      - 'version.json'
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel release in progress

jobs:
  auto-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Read version from version.json
      id: get_version
      run: |
        VERSION=$(jq -r '.version' version.json)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"

    - name: Check if nightly version
      id: check_nightly
      run: |
        VERSION="${{ steps.get_version.outputs.VERSION }}"
        if echo "$VERSION" | grep -q "nightly"; then
          echo "IS_NIGHTLY=true" >> $GITHUB_OUTPUT
          echo "⚠️ Nightly version detected ($VERSION)"
          echo "Stable auto-release workflow will not run for nightly versions"
          echo "Use the nightly-release.yml workflow for nightly builds"
        else
          echo "IS_NIGHTLY=false" >> $GITHUB_OUTPUT
          echo "✓ Stable version detected - proceeding with release"
        fi

    - name: Check if release already exists
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      id: check_release
      run: |
        if gh release view "v${{ steps.get_version.outputs.VERSION }}" > /dev/null 2>&1; then
          echo "EXISTS=true" >> $GITHUB_OUTPUT
          echo "Release v${{ steps.get_version.outputs.VERSION }} already exists"
        else
          echo "EXISTS=false" >> $GITHUB_OUTPUT
          echo "Release v${{ steps.get_version.outputs.VERSION }} does not exist"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true' && steps.check_release.outputs.EXISTS == 'false'
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Cache PlatformIO
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true' && steps.check_release.outputs.EXISTS == 'false'
      uses: actions/cache@v5
      with:
        path: |
          ~/.platformio
        key: ${{ runner.os }}-pio-v3-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-v3-

    - name: Set up ccache
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true' && steps.check_release.outputs.EXISTS == 'false'
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ runner.os }}-ccache-${{ hashFiles('**/platformio.ini') }}

    - name: Install PlatformIO
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true' && steps.check_release.outputs.EXISTS == 'false'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Clean build directory
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true' && steps.check_release.outputs.EXISTS == 'false'
      run: |
        rm -rf .pio
        echo "Build directory cleaned"

    - name: Build firmware (both screen variants)
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true' && steps.check_release.outputs.EXISTS == 'false'
      env:
        USE_CCACHE: "1"
      run: pio run -e esp32_4inch -e esp32_7inch

    - name: Assemble release assets (per-screen + legacy 4")
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true' && steps.check_release.outputs.EXISTS == 'false'
      run: |
        pip install esptool
        VER="${{ steps.get_version.outputs.VERSION }}"
        ROOT="$PWD"
        mkdir -p dist
        # bootloader + partitions are board-level (identical across SCREEN_SIZE) -> share one copy
        cp .pio/build/esp32_4inch/bootloader.bin dist/bootloader.bin
        cp .pio/build/esp32_4inch/partitions.bin dist/partitions.bin
        for s in 4inch 7inch; do
          OUT=".pio/build/esp32_${s}"
          cp "$OUT/firmware.bin" "dist/firmware-${s}.bin"
          # full single-image (web-flash) per screen
          python -m esptool --chip esp32p4 merge_bin -o "dist/firmware-merged-${s}.bin" \
            --flash_mode qio --flash_size 16MB \
            0x0 "$OUT/bootloader.bin" 0x8000 "$OUT/partitions.bin" 0x10000 "$OUT/firmware.bin"
          (cd "$OUT" && zip -r "$ROOT/dist/sonos-controller-firmware-${s}-v${VER}.zip" bootloader.bin partitions.bin firmware.bin)
        done
        # LEGACY unsuffixed assets the deployed <=v1.8.4 4" fleet's OTA matches by
        # the "firmware.bin" substring. Remove ~1 month after the multi-screen release.
        cp .pio/build/esp32_4inch/firmware.bin dist/firmware.bin
        cp dist/firmware-merged-4inch.bin dist/firmware-merged.bin
        ls -l dist/

    - name: Create GitHub Release
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true' && steps.check_release.outputs.EXISTS == 'false'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ steps.get_version.outputs.VERSION }}
        name: v${{ steps.get_version.outputs.VERSION }}
        files: |
          dist/firmware-4inch.bin
          dist/firmware-7inch.bin
          dist/firmware-merged-4inch.bin
          dist/firmware-merged-7inch.bin
          dist/bootloader.bin
          dist/partitions.bin
          dist/sonos-controller-firmware-4inch-v${{ steps.get_version.outputs.VERSION }}.zip
          dist/sonos-controller-firmware-7inch-v${{ steps.get_version.outputs.VERSION }}.zip
          dist/firmware.bin
          dist/firmware-merged.bin
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
