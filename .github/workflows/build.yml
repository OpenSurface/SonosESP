name: Build Firmware

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Pure CI verification (push/PR). Release assets are produced solely by
# auto-release.yml on a version.json bump, so there is no release trigger here
# (avoids a duplicate build + asset race against the release workflow).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Build every screen variant so a break in either is caught in CI.
    # 4" is the shipping product; 7" is code-complete but not yet hardware-validated.
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: esp32_4inch
            screen: 4inch
          - env: esp32_7inch
            screen: 7inch

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Read version from version.json
      id: get_version
      run: |
        VERSION=$(jq -r '.version' version.json)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $VERSION"

    - name: Check if nightly version
      id: check_nightly
      run: |
        VERSION="${{ steps.get_version.outputs.VERSION }}"
        if echo "$VERSION" | grep -q "nightly"; then
          echo "IS_NIGHTLY=true" >> $GITHUB_OUTPUT
          echo "⚠️ Nightly version detected ($VERSION)"
          echo "Build workflow skipped for nightly builds (use nightly-release.yml)"
        else
          echo "IS_NIGHTLY=false" >> $GITHUB_OUTPUT
          echo "✓ Stable version detected - proceeding with build"
        fi

    - name: Set up Python
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Cache PlatformIO
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      uses: actions/cache@v5
      with:
        path: |
          ~/.platformio
        key: ${{ runner.os }}-pio-v3-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-v3-

    - name: Set up ccache
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: ${{ runner.os }}-ccache-${{ matrix.env }}-${{ hashFiles('**/platformio.ini') }}

    - name: Install PlatformIO
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build firmware (${{ matrix.screen }})
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      env:
        USE_CCACHE: "1"
      run: pio run -e ${{ matrix.env }}

    - name: Stage binaries (${{ matrix.screen }})
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      run: |
        OUT=".pio/build/${{ matrix.env }}"
        mkdir -p dist
        cp "$OUT/bootloader.bin"  "dist/bootloader-${{ matrix.screen }}.bin"
        cp "$OUT/partitions.bin"  "dist/partitions-${{ matrix.screen }}.bin"
        cp "$OUT/firmware.bin"    "dist/firmware-${{ matrix.screen }}.bin"
        # Legacy unsuffixed names — kept ~1 month for the deployed <=v1.8.4 4" fleet
        # whose OTA matches the "firmware.bin" substring. Remove after transition.
        if [ "${{ matrix.screen }}" = "4inch" ]; then
          cp "$OUT/bootloader.bin" dist/bootloader.bin
          cp "$OUT/partitions.bin" dist/partitions.bin
          cp "$OUT/firmware.bin"   dist/firmware.bin
        fi
        ls -l dist/

    - name: Upload firmware artifacts (${{ matrix.screen }})
      if: steps.check_nightly.outputs.IS_NIGHTLY != 'true'
      uses: actions/upload-artifact@v7
      with:
        name: firmware-${{ matrix.screen }}
        path: dist/
        retention-days: 30
